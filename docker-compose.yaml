# ══════════════════════════════════════════════════════════════════
# CFO Sentinel — Docker Compose (Production)
# Menjalankan: FastAPI backend + Streamlit admin dashboard
# React frontend di-serve terpisah via Nginx
# ══════════════════════════════════════════════════════════════════

version: "3.9"

services:

  # ── Backend API (FastAPI) ──────────────────────────────────────
  cfo-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cfo-sentinel-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - cfo_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Streamlit Dashboard (Admin/Backup) ────────────────────────
  cfo-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cfo-sentinel-dashboard
    command: >
      streamlit run dashboard/app.py
      --server.address=0.0.0.0
      --server.port=8501
      --server.headless=true
      --server.fileWatcherType=none
      --browser.gatherUsageStats=false
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - cfo_data:/app/data
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  cfo_data:
    driver: local