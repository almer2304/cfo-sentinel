services:

  cfo-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cfo-sentinel-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - cfo_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  cfo-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cfo-sentinel-dashboard
    command: >
      streamlit run dashboard/app.py
      --server.address=0.0.0.0
      --server.port=8501
      --server.headless=true
      --server.fileWatcherType=none
      --browser.gatherUsageStats=false
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - cfo_data:/app/data
    restart: unless-stopped

volumes:
  cfo_data:
    driver: local